get:
  tags:
    - Styles
  summary: Retrieve a style for a specified collection
  operationId: .collection.getStyle
  parameters:
    - $ref: '../../parameters/common-geodata/collectionId-all.yaml'
    - $ref: '../../parameters/styles-core/styleId-collection.yaml'
    - $ref: '../../parameters/unspecified/f-style.yaml'
  responses:
    '200':
      $ref: '../../responses/styles-core/rStyle.yaml'
    '204':
      $ref: '../../responses/styles-core/rEmptyStyle.yaml'
    '400':
      $ref: '../../responses/styles-core/rBadRequest.yaml'
    '404':
      $ref: '../../responses/common-core/rNotFound.yaml'
    '406':
      $ref: '../../responses/common-core/rNotAcceptable.yaml'
    '500':
      $ref: '../../responses/common-core/rServerError.yaml'

put:
  tags:
    - Styles
  summary: Replace a style or create a new style with a specific id for a specified collection
  description: >-
    Replace an existing style with the id `styleId`, create a new style with the id `styleId`, or just validate a style, for collection `collectionId`.
    If the header `Prefer` is set to `handling=strict`, the style will be validated before adding the style to the server.
    If the parameter `dry-run` is set to `true`, the server will not be changed and only any validation errors will be reported.
  operationId: .collection.putStyle
  parameters:
    - $ref: '../../parameters/common-geodata/collectionId-all.yaml'
    - $ref: '../../parameters/styles-core/styleId-collection.yaml'
    - $ref: '../../parameters/styles-core/dry-run.yaml'
    - $ref: '../../parameters/styles-core/Prefer_header.yaml'
  requestBody:
    $ref: '../../responses/styles-core/rbStyle.yaml'
  responses:
    '201':
      $ref: '../../responses/styles-core/rResourceCreated.yaml'
    '204':
      $ref: '../../responses/styles-core/rEmptySuccess.yaml'
    '400':
      $ref: '../../responses/styles-core/rBadRequest.yaml'
    '401':
      $ref: '../../responses/styles-core/rUnauthorized.yaml'
    '403':
      $ref: '../../responses/styles-core/rForbidden.yaml'
    '404':
      $ref: '../../responses/common-core/rNotFound.yaml'
    '415':
      $ref: '../../responses/styles-core/rUnsupportedMediaType.yaml'
    '500':
      $ref: '../../responses/common-core/rServerError.yaml'

delete:
  tags:
    - Styles
  summary: Delete a style for a specified collection
  description: Delete an existing style with the id `styleId` for collection `collectionId`.
  operationId: .collection.deleteStyle
  parameters:
    - $ref: '../../parameters/common-geodata/collectionId-all.yaml'
    - $ref: '../../parameters/styles-core/styleId-collection.yaml'
  responses:
    '204':
      $ref: '../../responses/styles-core/rEmptySuccess.yaml'
    '400':
      $ref: '../../responses/styles-core/rBadRequest.yaml'
    '401':
      $ref: '../../responses/styles-core/rUnauthorized.yaml'
    '403':
      $ref: '../../responses/styles-core/rForbidden.yaml'
    '404':
      $ref: '../../responses/common-core/rNotFound.yaml'
    '500':
      $ref: '../../responses/common-core/rServerError.yaml'
